<!doctype html>
<html lang="{{lang}}">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>{{title}} · Kurviq</title>
<meta name="robots" content="noindex, follow" />
<link rel="icon" href="/favicon.ico" sizes="48x48" />
<link rel="icon" type="image/svg+xml" href="/kurviq.svg" />
<style>
  :root { color-scheme: light dark; --fg: #1e1e1e; --muted: #5b5a66; --bg: #fbfaf7; --link: #5b57d1; --line: #e3e1db; }
  @media (prefers-color-scheme: dark) { :root { --fg: #e6e6e6; --muted: #a3a2ad; --bg: #121212; --link: #a5a2ff; --line: #2c2b33; } }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 44rem; margin: 0 auto; padding: 2.5rem 1.25rem 4rem; }
  header { display: flex; align-items: center; gap: .75rem; margin-bottom: 2rem; }
  header a { display: flex; align-items: center; gap: .6rem; color: var(--fg); text-decoration: none; font-weight: 600; font-size: 1.15rem; }
  header img { width: 32px; height: 32px; }
  h1 { font-size: 1.8rem; margin: 0 0 1rem; }
  h2 { font-size: 1.15rem; margin: 2rem 0 .5rem; }
  p, li { color: var(--fg); }
  .muted { color: var(--muted); font-size: .9rem; }
  a { color: var(--link); }
  hr { border: 0; border-top: 1px solid var(--line); margin: 3rem 0 2rem; }
  address { font-style: normal; }
  nav { margin-top: 3rem; font-size: .9rem; color: var(--muted); }
</style>
</head>
<body>
<main>
<header><a href="/"><img src="/kurviq.svg" alt="" />Kurviq</a></header>
{{content}}
<nav><a href="/">← Back to Kurviq</a> · <a href="/imprint">Imprint / Impressum</a> · <a href="/privacy">Privacy / Datenschutz</a> · <a href="/terms">Terms / Nutzungsbedingungen</a></nav>
</main>
</body>
</html>
